# CrowdLine local stack. Every database container gets identical CPU/memory limits
# so each shard behaves like its own machine, even on a single laptop (NFR-04, D-007).

x-shard: &shard
  image: postgres:18-alpine
  environment:
    POSTGRES_DB: ${DB_DATABASE:-crowdline}
    POSTGRES_USER: ${DB_USERNAME:-crowdline}
    POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
  command:
    - postgres
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - pg_stat_statements.track=all
    - -c
    - shared_buffers=${SHARD_SHARED_BUFFERS:-256MB}
    - -c
    - max_connections=${SHARD_MAX_CONNECTIONS:-100}
    - -c
    - log_min_duration_statement=${SHARD_SLOW_QUERY_MS:-100}
    - -c
    - log_lock_waits=on
  volumes:
    - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  cpus: ${SHARD_CPUS:-1.0}
  mem_limit: ${SHARD_MEMORY:-1g}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  app:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: crowdline-app
    volumes:
      - .:/var/www/html
    environment:
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-32}
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
    cpus: ${APP_CPUS:-3.0}
    mem_limit: ${APP_MEMORY:-2g}
    # A stopped shard's hostname disappears from Docker DNS and the lookup falls through
    # to the host resolver (~7s per attempt). Fail fast so a dead shard returns 503 quickly.
    dns_opt:
      - timeout:1
      - attempts:1
    depends_on:
      redis: { condition: service_healthy }
      pg_global: { condition: service_healthy }
      shard_0: { condition: service_healthy }
      shard_1: { condition: service_healthy }
      shard_2: { condition: service_healthy }
      shard_ded_0: { condition: service_healthy }

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    cpus: 1.0
    mem_limit: 256m
    depends_on: [app]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6380}:6379"
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Non-sharded data: users, tokens, shard_map.
  pg_global:
    <<: *shard
    ports: ["127.0.0.1:54320:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_global:/var/lib/postgresql

  shard_0:
    <<: *shard
    ports: ["127.0.0.1:54330:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - shard_0:/var/lib/postgresql

  shard_1:
    <<: *shard
    ports: ["127.0.0.1:54331:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - shard_1:/var/lib/postgresql

  shard_2:
    <<: *shard
    ports: ["127.0.0.1:54332:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - shard_2:/var/lib/postgresql

  # Dedicated shard for celebrity accounts (FR-18). Empty until a user is moved here.
  shard_ded_0:
    <<: *shard
    ports: ["127.0.0.1:54340:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - shard_ded_0:/var/lib/postgresql

  # Load generator; only started explicitly: `docker compose run --rm k6 run ...`.
  k6:
    image: grafana/k6:1.3.0
    profiles: ["bench"]
    volumes:
      - ./benchmarks:/scripts
    working_dir: /scripts
    cpus: ${K6_CPUS:-2.0}
    mem_limit: 1g
    depends_on: [nginx]

volumes:
  pg_global:
  shard_0:
  shard_1:
  shard_2:
  shard_ded_0:
