memory_limit = 256M
expose_php = Off

; Opcache is on so benchmarks measure the app, not PHP compilation.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Bind-mounted code changes during development: keep revalidation on.
; Set to 0 for benchmark runs (see docs/benchmarks.md).
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
